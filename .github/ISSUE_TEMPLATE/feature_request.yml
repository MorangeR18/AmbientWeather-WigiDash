name: Feature request
description: Suggest an improvement or new sensor/layout capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Please describe the user problem first; implementation ideas are welcome but optional.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the desired behavior or display.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: hardware
    attributes:
      label: Relevant station or sensor hardware
      description: Model names are useful; do not include serial numbers, MAC addresses, or location.
